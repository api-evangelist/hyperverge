- aid: hyperverge:hyperverge-liveness-api
  name: HyperVerge Liveness Detection
  tags:
  - Liveness
  - Face Authentication
  - Fraud Prevention
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://hyperverge.co/in/integrations-marketplace/facial-recognition-api/
  baseURL: https://ind-faceid.hyperverge.co
  properties:
  - url: https://hyperverge.co/in/integrations-marketplace/facial-recognition-api/
    type: Documentation
  description: >-
    Passive liveness / presentation-attack detection from a single selfie, trained on 850M+ liveness checks.
    Delivered primarily through HyperVerge's mobile SDKs and the hosted onboarding Workflow; a standalone
    documented public REST endpoint for liveness was not confirmed in HyperVerge's published REST-API
    repos at review time, so no OpenAPI operation is asserted here.
