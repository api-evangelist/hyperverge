aid: hyperverge
url: https://raw.githubusercontent.com/api-evangelist/hyperverge/refs/heads/main/apis.yml
name: HyperVerge
kind: company
description: HyperVerge is an AI-based identity verification and customer onboarding
  platform (India-HQ, global) providing document OCR and KYC extraction, face match,
  passive liveness, government/central database verification, and field matching.
  Its REST APIs extract and verify Indian identity documents (PAN, Aadhaar, Passport,
  Voter ID, Driving License), match a selfie against an ID photo, and validate user
  input against central databases for onboarding, AML, and fraud prevention. APIs are
  region-hosted (India `ind-*`, plus APAC/other regions) and authenticated with an
  appId and appKey issued by HyperVerge; enterprise onboarding is required to obtain
  credentials.
