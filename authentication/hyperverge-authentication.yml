  description: >-
    HyperVerge issues an `appId` and `appKey` pair after enterprise onboarding.
    Both are sent as request headers on every call: `appId` and `appKey` on the
    KYC OCR (ind-docs.hyperverge.co) and Verification (ind-verify.hyperverge.co)
    hosts, and lowercase `appid` and `appkey` on the Face Match
    (ind-faceid.hyperverge.co) host. Credentials are not self-serve - they are
    provided by the HyperVerge team. Invalid or missing credentials return HTTP
    401. HyperVerge warns against exposing appId/appKey in browser applications;
    call the APIs server-side.
