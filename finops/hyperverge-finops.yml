publisherName: HyperVerge
serviceCategory: Identity and Fraud Prevention
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: HyperVerge Identity Verification
  ServiceCategory: Identity and Fraud Prevention
  ProviderName: HyperVerge
  PublisherName: HyperVerge
  InvoiceIssuerName: HyperVerge
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: kyc_verifications
  description: Document OCR / KYC extraction calls (readKYC, readPAN, readAadhaar, readPassport, readVoterID), billed per verification.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - document_type
  - region
- name: face_match_checks
  description: Face match (verifyPair) calls, billed per verification.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - region
- name: liveness_checks
  description: Passive liveness / presentation-attack checks (via SDK/Workflow), billed per verification.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - region
- name: database_verifications
  description: Central database verification calls (verifyPAN, checkDL, checkVoterId, checkBankAccount, getNameFromPAN), billed per verification.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - document_type
principles:
- name: Visibility
  description: Track billable verifications by module (OCR, face match, liveness, database) and by region host so cost maps to onboarding funnels.
- name: Allocation
  description: Use referenceId / transactionid on requests to attribute verifications to products, teams, or campaigns.
- name: Optimization
  description: Order the onboarding flow to fail fast (cheap validation before costlier database or biometric checks) and avoid redundant re-verifications; negotiate volume tiers against forecast volume.
- name: Accountability
  description: Assign owners per onboarding flow and review monthly verification counts and unit rates against the negotiated plan.
