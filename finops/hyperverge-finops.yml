description: >-
  FinOps view of HyperVerge spend. HyperVerge bills identity verification on a
  quote-based, volume-tiered model (Start / Grow / Enterprise). The dominant
  cost driver is the number of verifications performed - each document OCR / KYC
  extraction, face match, liveness check, or database verification is a billable
  transaction, with the per-verification unit rate decreasing as monthly volume
  increases. Advanced fraud-prevention modules can add incremental cost. There
  is no public per-unit price; amounts are negotiated with HyperVerge and are not
  reconciled here.
notes: >-
  Per-verification rates are quote-only and were not published at review time.
  For cost control, track billable verifications per module and per region host,
  and negotiate volume tiers against forecast onboarding volume. Reconcile actual
  unit rates and any module surcharges with HyperVerge sales.
